name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra sigma-backends --group sigma-cli
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra sigma-backends --group sigma-cli
      - run: uv run pytest --cov=rosettalog --cov-report=term-missing
      - name: End-to-end example
        run: >
          uv run rosettalog convert examples/acme_firewall/acme_fw.lsx.xml
          --to sentinel --to splunk --samples examples/acme_firewall/samples.yaml -o out
      - name: End-to-end rules example (Sigma + pySigma)
        run: >
          uv run rosettalog convert examples/rules/acme_rules.ir.json --to sigma
          -O sigma.pysigma_targets=splunk,kusto,lucene,esql
          --samples examples/rules/samples.yaml -o out-rules
      - name: sigma check (sigma-cli) over the generated rules
        run: uv run sigma check --fail-on-error --fail-on-issues out-rules/sigma

  test-without-extras:
    # pySigma is optional: everything else must work, and Sigma output is flagged as not validated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run mypy src
      - run: uv run pytest
