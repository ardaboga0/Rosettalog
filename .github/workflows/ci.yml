name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra sigma-backends --group sigma-cli
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra sigma-backends --group sigma-cli
      - run: uv run pytest --cov=rosettalog --cov-report=term-missing
      - name: End-to-end example
        run: >
          uv run rosettalog convert examples/acme_firewall/acme_fw.lsx.xml
          --to sentinel --to splunk --to xsiam --samples examples/acme_firewall/samples.yaml -o out
      - name: End-to-end rules example (Sigma + pySigma)
        run: >
          uv run rosettalog convert examples/rules/acme_rules.ir.json --to sigma
          -O sigma.pysigma_targets=splunk,kusto,lucene,esql
          --samples examples/rules/samples.yaml -o out-rules
      - name: End-to-end stateful rules example (Sigma correlations)
        run: >
          uv run rosettalog convert examples/rules-stateful/stateful_rules.ir.json --to sigma
          -O sigma.pysigma_targets=splunk,kusto,esql,eql
          --samples examples/rules-stateful/samples.yaml -o out-rules-stateful
      - name: End-to-end building-block example (references, inlining)
        run: >
          uv run rosettalog convert examples/rules-bb/bb_rules.ir.json --to sigma
          -O sigma.pysigma_targets=splunk,kusto,lucene,esql,eql
          --samples examples/rules-bb/samples.yaml -o out-rules-bb
      - name: sigma check (sigma-cli) over the generated rules
        run: uv run sigma check --fail-on-error --fail-on-issues out-rules/sigma out-rules-stateful/sigma out-rules-bb/sigma

  package:
    # Build sdist + wheel, install the wheel into a clean venv (outside the source tree) and run
    # the examples from the installed package: data files (field_map.yaml, assumptions) must ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the wheel in a clean venv and run the examples
        run: |
          set -eu
          work=$(mktemp -d)
          cp -R examples "$work/"
          uv venv --python 3.12 "$work/venv"
          uv pip install --python "$work/venv/bin/python" "$(ls dist/*.whl)[sigma-backends]"
          cd "$work"
          venv/bin/rosettalog --help
          venv/bin/rosettalog convert examples/acme_firewall/acme_fw.lsx.xml \
            --to sentinel --to splunk --to elastic --to xsiam --sourcetype acme:firewall \
            --samples examples/acme_firewall/samples.yaml --require-ground-truth -o out
          grep -q "Unconfirmed global assumptions" out/report.md
          grep -q "^| X02 " out/report.md
          ls out/*/xsiam/*.model.xif
          venv/bin/rosettalog convert examples/rules-stateful/stateful_rules.ir.json --to sigma \
            -O sigma.pysigma_targets=splunk,esql --samples examples/rules-stateful/samples.yaml -o out-rules
          grep -q "^| R0" out-rules/report.md

  test-without-extras:
    # pySigma is optional: everything else must work, and Sigma output is flagged as not validated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run mypy src
      - run: uv run pytest
