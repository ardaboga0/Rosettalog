# Single source of truth for the QRadar RULE behaviours Rosettalog ASSUMES where IBM's
# documentation is silent or ambiguous (the LSX ones live in ../qradar_lsx/assumptions.yaml).
#
# Generated from this file (do not edit by hand; run
# `uv run python -m rosettalog.frontends.qradar_rules.docs_sync` after changing it):
#   - docs/rules-support-matrix.md              "Assumed rule behaviours" table
#   - examples/confirmation-rules/README.md     "Cases" table
# Each entry states what Rosettalog CURRENTLY does (IR evaluator, Sigma backend). Nothing here
# is confirmed; the status changes only when a QRadar CE result is recorded.
source_format: qradar-rules
confirmation_dir: examples/confirmation-rules
assumptions:
  - id: R01
    case: 01-value-case
    question: Are event-property "equals" and "contains" tests case-sensitive?
    assumption: >-
      Yes, unless the test is marked case-insensitive. Sigma output is written case-insensitively
      anyway (pySigma backends refuse 'cased'), which makes such rules broader.
    alternatives: >-
      Case-insensitive: the equals rule also matches admin and ADMIN (e2, e3); the contains rule
      also matches Admin, ADMIN and xAdminx (e1, e3, e4).
    scope: per-artifact
    findings: [SIGMA_CASE_BROADENED]
    topic: rule-value-case

  - id: R02
    case: 02-regex-find
    question: Does a "matches regex" test match anywhere in the value, or must it match the whole value?
    assumption: Anywhere in the value (java.util.regex find semantics), like LSX patterns.
    alternatives: The whole value (only 'adm' matches; 'sysadmin' does not).
    scope: global
    topic: rule-regex-find

  - id: R03
    case: 03-missing-property
    question: How does a test on a property the event does not have evaluate, and its negation?
    assumption: >-
      The test is false, so its negation is true: an event without a username matches
      "NOT username equals bob".
    alternatives: >-
      Any test on a missing property makes the rule not match, negated or not (e3 does not
      match).
    scope: global
    topic: rule-missing-property

  - id: R04
    case: 04-counter-window
    question: Is the "in N minutes" window of a counter test sliding, or fixed time buckets?
    assumption: >-
      Sliding: the rule fires when the threshold is reached within any N-minute interval (Sigma
      correlation windows are sliding as well).
    alternatives: >-
      Fixed buckets (e.g. clock minutes): e1-e3 fall into two buckets when sending starts at
      about hh:mm:40, so the rule does not fire.
    scope: per-artifact
    findings: [SIGMA_COUNTER_WINDOW]
    topic: rule-counter-window

  - id: R05
    case: 05-counter-grouping
    question: With "the same Source IP and Username", are events counted per combination of both properties?
    assumption: Per combination (like Sigma group-by with several fields).
    alternatives: >-
      Per Source IP only, or per property separately: the rule then also fires for
      192.0.2.10 as a whole (already at e2), not only for 192.0.2.10 with user a (at e4).
    scope: per-artifact
    findings: [SIGMA_COUNTER_GROUPING]
    topic: rule-counter-grouping

  - id: R06
    case: 06-counter-firing
    question: Once a counter's threshold is reached, does the rule fire once, or again for every further event in the window?
    assumption: >-
      Once per group and window, at the event that reaches the threshold (e2). Verification
      compares which groups alert, not how often, so this only affects the number of alerts.
    alternatives: The rule fires for e2, e3 and e4 (one alert or offense contribution each).
    scope: global
    topic: rule-counter-firing

  - id: R07
    case: 07-sequence-gaps
    question: In a sequence ("in the order"), may other events occur between the steps?
    assumption: Yes. Only the order of the step events matters (Sigma temporal_ordered).
    alternatives: No. An event in between (e2) breaks the sequence, so 192.0.2.10 does not fire.
    scope: per-artifact
    findings: [SIGMA_SEQUENCE_GAPS]
    topic: rule-sequence-gaps

  - id: R08
    case: 08-sequence-window
    question: Is a sequence's "within N minutes" measured from the first to the last step?
    assumption: >-
      Yes. All steps must fall within N minutes of the first one (Sigma: all events inside the
      timespan).
    alternatives: >-
      Measured between consecutive steps: 192.0.2.10 (40 s between steps, 80 s in total) fires
      too.
    scope: per-artifact
    findings: [SIGMA_SEQUENCE_WINDOW]
    topic: rule-sequence-window

  - id: R09
    case: 09-building-blocks
    question: >-
      Are building blocks evaluated per event, so that "matches any of these rules" is an OR of
      the building blocks' tests on that event, and "matches all" an AND on that same event?
    assumption: >-
      Yes. A referenced building block is equivalent to its tests, applied to the same event, so
      Rosettalog inlines them into rules (Sigma cannot reference rules in a detection).
    alternatives: >-
      "All" is satisfied across different events (e.g. e1 and e2 together, so the all-rule also
      fires for e2), or building blocks keep state of their own.
    scope: global
    topic: rule-building-blocks
