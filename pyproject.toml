[project]
name = "rosettalog"
version = "0.1.0"
description = "Migrate QRadar detection content (log source extensions, AQL) to other SIEMs with honest, verifiable translation reports."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Arda Boga and Rosettalog contributors" }]
keywords = ["siem", "qradar", "sentinel", "splunk", "kql", "detection-engineering", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "lxml>=5.2",
    "regex>=2024.5.15",
    "google-re2>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Sigma output is validated with pySigma, and pySigma's backends convert it to target queries.
# Pinned: conversion results (and the gaps we report for them) are specific to these versions.
sigma = ["pysigma==1.5.1"]
sigma-backends = [
    "pysigma==1.5.1",
    "pysigma-backend-splunk==2.1.0",
    "pysigma-backend-kusto==1.0.1",
    "pysigma-backend-elasticsearch==2.1.1",
]

[project.scripts]
rosettalog = "rosettalog.cli:app"

[project.entry-points."rosettalog.frontends"]
qradar-lsx = "rosettalog.frontends.qradar_lsx:QRadarLsxFrontend"
rosettalog-ir = "rosettalog.frontends.ir_json:IrJsonFrontend"
qradar-rules = "rosettalog.frontends.qradar_rules:QRadarRulesFrontend"

[project.entry-points."rosettalog.backends"]
sentinel = "rosettalog.backends.sentinel:SentinelBackend"
splunk = "rosettalog.backends.splunk:SplunkBackend"
elastic = "rosettalog.backends.elastic:ElasticBackend"
sigma = "rosettalog.backends.sigma:SigmaBackend"
xsiam = "rosettalog.backends.xsiam:XsiamBackend"

[project.entry-points."rosettalog.emulators"]
sentinel = "rosettalog.verify.emulators.kql:KqlEmulator"
splunk = "rosettalog.verify.emulators.splunk:SplunkEmulator"
elastic = "rosettalog.verify.emulators.elastic:ElasticEmulator"
sigma = "rosettalog.verify.emulators.sigma:SigmaEmulator"
xsiam = "rosettalog.verify.emulators.xsiam:XsiamEmulator"

[project.entry-points."rosettalog.runners"]
elastic = "rosettalog.verify.real.elastic:ElasticRunner"
splunk = "rosettalog.verify.real.splunk:SplunkRunner"
sentinel = "rosettalog.verify.real.kusto:KustainerRunner"
sentinel-adx = "rosettalog.verify.real.kusto:AdxRunner"
xsiam = "rosettalog.verify.real.xsiam:XsiamRunner"

[project.urls]
Homepage = "https://github.com/ardaboga0/Rosettalog"
Repository = "https://github.com/ardaboga0/Rosettalog"
Issues = "https://github.com/ardaboga0/Rosettalog/issues"
Changelog = "https://github.com/ardaboga0/Rosettalog/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "lxml-stubs>=0.5",
    "types-PyYAML>=6.0",
    "types-regex>=2024.5",
]
# `sigma check` in CI; kept apart from dev so that a plain `uv sync` has no pySigma at all.
sigma-cli = ["sigma-cli==3.1.0"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosettalog"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["re2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pySigma is an optional extra; without it, its imports are unresolved (and unused at runtime).
module = ["sigma", "sigma.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_engine: runs generated content on a real target engine (Docker); opt-in via --real-engine",
]
